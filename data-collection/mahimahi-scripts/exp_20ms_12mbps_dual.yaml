output_dir: ./outputs/12mbps/dual

secs_per_run: 35
num_runs: 50

# Mahimahi traces
traces:
  up: ../traces/DSL_12Mbps.up
  down: ../traces/DSL_12Mbps.down

# Always remember mahimahi for classic has inner 10ms RTT while kernel has 0
# mahimahi also x2 this delay 

mahimahi:
  delay_ms: 10 # 2 x 10 = 20 

# Queue discipline configuration (used by mm-link)
queue:
  type: dualPI2
  packets: 250
  target: 15
  tupdate: 16
  alpha: 0.00016
  beta: 0.0032

paths:
  scream_dir: /home/linghe-zhang/scream/scream

flows:
  # Ports used per run:
  #   classic port = base_port + 2*idx
  #   l4s     port = base_port + 2*idx + 1
  base_port: 5300

  # Classic SCReAM flow (UDP). Presence enables it.
  classic: { enabled: true }
  l4s:     { enabled: true }