output_dir: ./outputs/12mbps/l4s

secs_per_run: 35
num_runs: 50

# Mahimahi traces
traces:
  up: ../traces/DSL_12Mbps.up
  down: ../traces/DSL_12Mbps.down

mahimahi:
  delay_ms: 10

# Queue discipline configuration (used by mm-link)
queue:
  type: dualPI2
  packets: 250
  target: 15
  tupdate: 16
  alpha: 0.00016
  beta: 0.0032

paths:
  scream_dir: /home/linghe-zhang/scream/scream

flows:
  # Ports used per run:
  #   classic port = base_port + 2*idx
  #   l4s     port = base_port + 2*idx + 1
  base_port: 5300

  classic: { enabled: false }
  l4s:     { enabled: true }