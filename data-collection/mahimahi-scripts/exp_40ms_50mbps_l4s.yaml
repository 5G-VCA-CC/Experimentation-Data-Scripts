output_dir: ./outputs/50mbps/l4s

secs_per_run: 30
num_runs: 20

# Mahimahi traces
traces:
  up: ../traces/LTE5G_50Mbps.up
  down: ../traces/LTE5G_50Mbps.down

# Always remember mahimahi for classic has inner 10ms RTT while kernel has 0
# mahimahi also x2 this delay

mahimahi:
  delay_ms: 20 # 2 x 20 = 40ms

# Queue discipline configuration (used by mm-link)
queue:
  type: dualPI2
  packets: 1042
  target: 15
  tupdate: 16
  alpha: 0.00016
  beta: 0.0032

paths:
  scream_dir: /home/linghe-zhang/scream/scream

flows:
  # Ports used per run:
  #   classic port = base_port + 2*idx
  #   l4s     port = base_port + 2*idx + 1
  base_port: 5300

  # Classic SCReAM flow (UDP). Presence enables it.
  classic:
    # ECT(0) in the ECN field (decimal 2)
    tos: 2

  l4s:
    # ECT(1) in the ECN field (decimal 1)
    tos: 1