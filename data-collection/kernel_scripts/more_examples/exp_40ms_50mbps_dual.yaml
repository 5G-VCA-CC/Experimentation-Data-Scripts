runs:
  secs_per_run: 30
  num_runs: 100
  setup_sec: 3
  warmup_sec: 0
  cooldown_sec: 3

net:
  ns_s: ns_s
  ns_r: ns_r
  veth_dev: veth-s
  dst_ip: 172.20.1.2
  port_classic: 8080
  port_l4s: 8081
  rtt_ms: 40

paths:
  tc_bin: /home/linghe-zhang/iproute2/tc/tc
  scream_dir: /home/linghe-zhang/scream/scream

qdisc:
  rate: 50mbit
  burst: 25k
  target: 15ms
  tupdate: 16ms
  limit: 1042
  alpha: 0.16
  beta: 3.2

# Presence enables flow. SCReAM bw test is UDP-only.
flows:
  classic:
    tos: 2   # ECT(0)
    udp_blast_value_mbps: 50
  l4s:
    tos: 1   # ECT(1)

logging:
  dir: ./tmp/50mbps/dual
  qdisc_sample_sec: 0.016
