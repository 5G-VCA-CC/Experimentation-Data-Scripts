output_dir: ./outputs/200mbps-10/l4s

secs_per_run: 30
num_runs: 100

MAX_DELAY_THRESH_MS: 10

# Mahimahi traces
traces:
  up: ../traces/Fiber_200Mbps.up
  down: ../traces/Fiber_200Mbps.down

# Always remember mahimahi for classic has inner 10ms RTT while kernel has 0
# mahimahi also x2 this delay

mahimahi:
  delay_ms: 50 # 2 x 50 = 100ms

# Queue discipline configuration (used by mm-link)
queue:
  type: dualPI2
  packets: 4167
  target: 15
  tupdate: 16
  alpha: 0.16
  beta: 3.2

paths:
  scream_dir: /home/linghe-zhang/scream/scream

flows:
  # Ports used per run:
  #   classic port = base_port + 2*idx
  #   l4s     port = base_port + 2*idx + 1
  base_port: 5300

  classic: { enabled: false }
  l4s:     { enabled: true }