output_dir: ./outputs/12mbps/classic-30

secs_per_run: 30
num_runs: 100
MAX_DELAY_THRESH_MS: 1

# Mahimahi traces
traces:
  up: ../traces/fixed-12mbps.trace
  down: ../traces/fixed-12mbps.trace

# mahimahi also x2 this delay

mahimahi:
  delay_ms: 10 # 2 x 10 = 20 

# Queue discipline configuration (used by mm-link)
queue:
  type: dualPI2
  packets: 250
  target: 30
  tupdate: 16
  alpha: 0.16
  beta: 3.2
paths:
  scream_dir: /home/linghe-zhang/scream/scream

flows:
  # Ports used per run:
  #   classic port = base_port + 2*idx
  #   l4s     port = base_port + 2*idx + 1
  base_port: 5300

  # Classic SCReAM flow (UDP). Presence enables it.
  classic: { enabled: true }
  l4s:     { enabled: false }