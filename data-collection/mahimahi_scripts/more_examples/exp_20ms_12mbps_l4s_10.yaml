output_dir: ./outputs/12mbps/l4s-10
MAX_DELAY_THRESH_MS: 10

secs_per_run: 30
num_runs: 100

# Mahimahi traces
traces:
  up: ../traces/fixed-12mbps.trace
  down: ../traces/fixed-12mbps.trace
  
mahimahi:
  delay_ms: 10

# Queue discipline configuration (used by mm-link)
queue:
  type: dualPI2
  packets: 250
  target: 15
  tupdate: 16
  alpha: 0.16
  beta: 3.2
paths:
  scream_dir: /home/linghe-zhang/scream/scream

flows:
  # Ports used per run:
  #   classic port = base_port + 2*idx
  #   l4s     port = base_port + 2*idx + 1
  base_port: 5300

  classic: { enabled: false }
  l4s:     { enabled: true }